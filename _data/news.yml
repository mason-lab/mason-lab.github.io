- date: 15 Apr 2023
  headline: Quinn was awarded an NSERC PGS-D for his ongoing research on the comparative phylogeography of Polylepis birds! Congrats, Quinn!!!
  
  - date: 04 Apr 2023
  headline: Sam was awarded an NSF GRFP for her ongoing research on the evolution of iridesence in starlings! Congrats, Sam!!!

- date: 20 Nov 2022
  headline: Nick and coauthors published on <a href="https://onlinelibrary.wiley.com/doi/full/10.1002/ece3.9517">deep genetic, phenotypic, and ecological divergence in Steller's Jays</a> in the journal Ecology and Evolution. 
  
- date: 27 Sep 2022
  headline: Sam was interviewed by <a  href="https://www.theadvocate.com/baton_rouge/entertainment_life/article_62ded354-3a86-11ed-9e70-a3e44dc549f8.html">the Advocate</a> about her interest in bird color and her recent Special Saturday outreach event. Go Sam!

- date: 15 Sep 2022
  headline: The Fall 2022 semester is underway and the Mason Lab has been enjoying spending Thursday afternoons preparing specimens with Steve Cardiff, Donna Dittman, and many of the other ornithologists at the LSUMNS. 
  
- date: 15 Aug 2022
  headline: We welcome Quinn McCallum to the Mason Lab! Quinn is joining our group as a graduate student and will be studying comparative phylogeography of Polylepis birds. Quinn joins us from the University of British Columbia, where he did his undergraduate honors thesis with Darren Irwin on Zonotrichia sparrows. Welcome, Quinn!

- date: 10 Aug 2022
  headline: We welcome Diego Ocampo Vargas to the Mason Lab! Diego is joining our group as the LSUMNS postdoctoral researcher and will be working with Nick to study diversificaiton dynamics in Sporophila. Diego is originally from Costa Rica and did his PhD with Al Uy at University of Miami and University of Rochester. Bienvenidos, Diego!

- date: 01 Aug 2022
  headline: Nick was part of a collaborative team (with PI Laura Lagomarsino, Co-PI Zakiya Kennedy-Wilson, Co-PI Morgan Kelly, and Co-PI Jeremy Brown) that was awarded an NSF RaMP grant for 3 million dollars to establish a postbacclaureate research program at LSU. We look forward to the Louisiana Graduate Network in Applied Evolution (LAGNiAppE) starting next summer!

- date: 30 Jun 2022
  headline: The Mason Lab travelled to San Juan, Puerto Rico, where they took part in the joint conference of the American Ornithological Society and Birds Caribbean. Everyone presented some part of their research by poster or talk and a good time was had by all.
  
- date: 01 Jun 2022
  headline: Nick travelled to northwestern Pennsylvania where he collaborated with Luke Musher and Jon Merwin of the ANSP to get samples of Henslow's Sparrows for a project in collaboration with Jaime Collazo and Emily Nastase at North Carolina State University.
  
- date: 15 May 2022
  headline: The Mason Lab enjoyed some local field work this month in the Atchafalaya Basin, where we sampled some local breeding birds (which are surprisingly sparse in our colleciton!). Highlights included Yellow-throated Warbler, Summer Tanager, Carolina Wren, and Painted Bunting!
  
- date: 01 May 2022
  headline: We bid a fond farewell to two of our founding lab members, Subir Shakya and Maggie MacPherson. They are both going on to exciting new chapters in their careers. Subir will be joining Scott Edwards and Tim Sackton at Harvard while Maggie will be joining the Boreal Avian Modeling Project at Larval University. 
  
- date: 19 Apr 2022
  headline: David has received financial support for his dissertation research from the Chapman Memorial Research Fund at the American Museum of Natural History and the American Ornithological Society. Congrats, David!
  
- date: 18 Apr 2022
  headline: David successfully presented his plan for dissertation research at the LSU SEE seminar series today. Congrats, David! We look forward to your road ahead.
  
