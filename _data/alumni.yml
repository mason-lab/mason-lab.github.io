- name: "Anna Borne"
  title: "Undergraduate Researcher, currently a DVM student at LSU"
  picture: annaBorne.png
  bio: "Anna is an undergraduate researcher who joined the Mason Lab with support from the LSU Discover Program. Anna is collecting and analyzing phenotypic data from our museum specimens, including collect morphological and color data on the Tit-like Dacnis (Xenodacnis parina)."
