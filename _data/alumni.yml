- name: "Diego Ocampo"
  title: "Postdoctoral Researcher (2022-2025), currently Staff Curator at the Museum of Vertebrate Zoology"
  picture: Ocampo_photo.jpeg
  bio: "Diego has broad interest in understanding the evolutionary process that has led to diverse bird morphs and behaviors, especially in Neotropical birds. More specifically, Diego uses museum-based research and bioinformatic tools to look at the population structure, the genomic architecture of adaptive traits, as well as the behavioral and ecological factors that drive the divergence of phenotypes. Diego is currently focusing on the mode and tempo of trait evolution across the genus Sporophila."
  labels:
    - type: twitter
      twitter: https://x.com/Ocampo_D1E60
    - type: website
      website: https://ocampodiego.weebly.com/
    - type: orcid
      orcid: https://orcid.org/0000-0002-7411-2027
