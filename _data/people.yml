- name: "Diego Ocampo"
  title: "Postdoctoral Researcher"
  picture: Ocampo_photo.jpeg
  bio: "Diego has broad interest in understanding the evolutionary process that has led to diverse bird morphs and behaviors, especially in Neotropical birds. More specifically, Diego uses museum-based research and bioinformatic tools to look at the population structure, the genomic architecture of adaptive traits, as well as the behavioral and ecological factors that drive the divergence of phenotypes. Diego is currently focusing on the mode and tempo of trait evolution across the genus Sporophila."
  labels:
    - type: website
      website: https://ocampodiego.weebly.com/
    - type: orcid
      orcid: https://orcid.org/0000-0002-7411-2027
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=ZUB9sRsAAAAJ&hl=en&oi=ao
              
- name: "David Vander Pluym"
  title: "PhD Student"
  picture: Picture13.jpg
  bio: "David is a graduate of the University of California, Santa Cruz with a Bachelor of Sciences in Ecology and Evolutionary Biology. He has worked for several non profits along the lower Colorado River conducting research on riparian breeders and the ecology of Elf Owls. During this time he also conducted independent research on avian migration along the Colorado River. David’s research interests include how avian migration relates to biogeography, systematics, and the impacts of climate change on these systems."
  labels:
    - type: twitter
      twitter: https://twitter.com/PluymDavid
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=B406Eq8AAAAJ&hl=en
      
- name: "Samantha L. Rutledge"
  title: "PhD Student"
  picture: SamanthaHeadshotSquare.jpg
  bio: "Graduating from Mansfield University of Pennsylvania with a Bachelor of Science  in General Biology, Samantha has conducted research on avian brood parasitism and gregariousness, completing two internships through the University of Virginia and the Smithsonian National Museum of Natural History. Her current research interests encompass the impact of climate change on avian evolution and conservation; the origin, structure, and function of avian iridescence; and the potential biomimetic technologies stemming from avian feather structure."
  labels:
    - type: twitter
      twitter: https://twitter.com/slrutledge27
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=Yn9CgqEAAAAJ&hl=en
      
- name: "Quinn McCallum"
  title: "PhD Student"
  picture: QM-lab-site-photo-option-1.jpg
  bio: "Quinn graduated from the University of British Columbia with an Honours in Evolutionary Biology, where he studied genomic divergence and mitochondrial introgression between White-crowned and Golden-crowned Sparrows. Quinn is broadly interested in diversification, biogeography, and integrative taxonomy. Currently, he is studying the comparative phylogeography of birds inhabiting Andean sky islands. Quinn is also a trained illustrator and is passionate about connecting people and birds through outreach and community science."
  labels:
    - type: website
      website: https://quinnmccallum.com/
    - type: twitter
      twitter: https://mobile.twitter.com/quinn_mccallum

- name: "Anna Borne"
  title: "Undergraduate Researcher"
  picture: annaBorne.png
  bio: "Anna is an undergraduate researcher who joined the Mason Lab with support from the LSU Discover Program. Anna is collecting and analyzing phenotypic data from our museum specimens, including collect morphological and color data on the Tit-like Dacnis (Xenodacnis parina)."

    
     