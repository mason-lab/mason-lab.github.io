- name: "Subir B. Shakya"
  title: "Postdoctoral Researcher"
  picture: SubirHeadshot.png
  bio: "Subir is interested in the genetic underpinnings of phenotypes (especially color) in birds. Subir is particularly interested in integrating genetic data with biochemical, ecological, morphological, and spatial data to get a much better understanding of the mechanisms of variation. He is also interested in the phylogeny, biogeography, and natural history of birds, particularly birds from the Old World."
  labels:
    - type: website
      website: http://subir.com.np/
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=ETGvbj0AAAAJ&hl=en
  
- name: "Maggie MacPherson"
  title: "Postdoctoral Researcher"
  picture: MaggieMacPhersonHeadshot.jpeg
  bio: "Maggie studies what shapes species distributions, mainly in birds. She has a particular interest in improving our understanding of the drivers of range dynamics in migratory species. Her recent research includes building seasonal species distribution models using citizen science datasets and improving our ability to identify umbrella taxa and to understand what shapes ranges using Bayesian belief networks. Her ultimate research goal is to contribute to research that improves our ability to protect wildlife across rapidly changing landscapes by testing the relative roles of ecological and evolutionary processes that contribute to patterns in geographic range limits."
  labels:
    - type: website
      website: http://maggiepmacpherson.com/
    - type: twitter
      twitter: https://twitter.com/B1rdz_Lady
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=o2F7SKEAAAAJ&hl=en
      
- name: "David Vander Pluym"
  title: "PhD Student"
  picture: Picture13.jpg
  bio: "David is a graduate of the University of California, Santa Cruz with a Bachelor of Sciences in Ecology and Evolutionary Biology. He has worked for several non profits along the lower Colorado River conducting research on riparian breeders and the ecology of Elf Owls. During this time he also conducted independent research on avian migration along the Colorado River. David’s research interests include how avian migration relates to biogeography, systematics, and the impacts of climate change on these systems."
  labels:
    - type: googlescholar
      googlescholar: https://scholar.google.com/citations?user=B406Eq8AAAAJ&hl=en
      
- name: "Samantha L. Rutledge"
  title: "PhD Student"
  picture: SamanthaHeadshotSquare.jpg
  bio: "Graduating from Mansfield University of Pennsylvania with a Bachelor of Science  in General Biology, Samantha has conducted research on avian brood parasitism and gregariousness, completing two internships through the University of Virginia and the Smithsonian National Museum of Natural History. Her current research interests encompass the impact of climate change on avian evolution and conservation; the origin, structure, and function of avian iridescence; and the potential biomimetic technologies stemming from avian feather structure."
