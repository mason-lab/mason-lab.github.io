- name: "Quinn McCallum"
  title: "PhD Student"
  picture: QM-lab-site-photo-option-1.jpg
  bio: "Quinn graduated from the University of British Columbia with an Honours in Evolutionary Biology, where he studied genomic divergence and mitochondrial introgression between White-crowned and Golden-crowned Sparrows. Quinn is broadly interested in diversification, biogeography, and integrative taxonomy. Currently, he is studying the comparative phylogeography of birds inhabiting Andean sky islands. Quinn is also a trained illustrator and is passionate about connecting people and birds through outreach and community science."
  labels:
    - type: website
      website: https://quinnmccallum.com/
    - type: twitter
      twitter: https://x.com/quinn_mccallum

- name: "Amanda Harvey"
  title: "PhD Student"
  picture: AmandaHarvey_01_square.jpg
  bio: "Amanda Harvey graduated from Texas A&M University with a Bachelor of Science in Ecology and Conservation Biology, and worked within the university’s Biodiversity Research Teaching Collections. Prior to joining as a PhD student, Amanda working in the Mason Lab as a postbaccalaureate scholar through the NSF LAGniAppE program. Amanda is broadly interested in population genetics, speciation, ecotoxicology and the effects of anthropogenic change on population dynamics and distributions."
  labels:
    - type: twitter
      twitter: https://x.com/harveyyamanda

- name: "Brett Kincade"
  title: "Postbaccalaureate Scholar"
  picture: kincade.jpg
  bio: "Brett is interested in phylogenetics and the morphological and genetic changes o  birds over time. He is interested in comparative phylogeography, integrative taxonomy, and avian systematics. A New Orleans native, Brett has joined the Mason Lab as a postbaccalaureate scholar through the NSF LAGniAppE program, during which he is studying the phylogeography of Geospizopsis tanagers."
  
- name: "Melissa Salazar"
  title: "Postbaccalaureate Scholar"
  picture: salazar.jpg
  bio: "Melissa is interested in ornithology, ecotoxicology, and urban ecology. Originally from Arlington, Melissa joined the Mason Lab via the NSF LAGniAppE program and will be studying trends in heavy metal contamination in King and Clapper Rails across an ecological gradient."

    
     